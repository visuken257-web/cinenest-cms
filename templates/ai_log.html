{% extends "base.html" %}

{% block page_title %}Nhật ký sử dụng AI — MovieNest CMS{% endblock %}

{% block page_content %}
<div class="row">
  <div class="col-md-8 col-md-offset-2">
    <div class="panel panel-dark" style="padding: 30px; border-radius: 10px;">
      <div style="border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px;">
        <h2 style="color: #fff; margin-top: 0; font-weight: 700;">
          <i class="fas fa-robot" style="color: #f59e0b;"></i> Nhật Ký Sử Dụng AI Tool (Buổi 39)
        </h2>
        <p class="text-muted-dark">Minh họa Prompt Engineering, AI Code Review và Ranh giới Đạo đức khi dùng AI</p>
      </div>

      <div style="color: #ddd; font-size: 14px; line-height: 1.8;">
        {{ content | safe }}
      </div>
    </div>
  </div>
</div>
{% endblock %}
